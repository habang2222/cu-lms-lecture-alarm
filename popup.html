<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>싸강 완료 알림</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <div class="bell" aria-hidden="true">●</div>
        <div>
          <h1>싸강 완료 알림</h1>
          <p>iLOS 강의 종료 감지</p>
        </div>
      </header>

      <section class="status-card" aria-live="polite">
        <div class="status-line">
          <span id="status-dot" class="dot searching"></span>
          <strong id="status-text">확인 중…</strong>
        </div>
        <p id="lecture-title">온라인 강의</p>
        <div class="progress-track" aria-label="재생 진도">
          <div id="progress-bar" class="progress-bar"></div>
        </div>
        <div class="progress-labels">
          <span id="time-text">0:00 / 0:00</span>
          <span id="percent-text">0%</span>
        </div>
      </section>

      <section class="settings">
        <label>
          <span>
            <strong>완료 알림</strong>
            <small>Windows 알림을 계속 표시</small>
          </span>
          <input id="enabled-toggle" type="checkbox" checked>
        </label>
      </section>

      <button id="test-button" type="button">알림 테스트</button>
      <p id="hint">강의 탭을 새로고침한 뒤 재생하면 자동으로 감지합니다.</p>
    </main>
    <script src="logic.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
